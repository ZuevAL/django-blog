{% if user.is_authenticated %}
<form action="{% url 'blog:post_comment' post.id %}" method="post" novalidate>
    {% csrf_token %}
    <div class="row">
        <h3>Добавить новый пост</h3>

        <div class="mt-2">
            {{ form.body }}
            {% if form.body.errors %}
                <div class="text-danger">
                    {{ form.body.errors }}
                </div>
            {% endif %}
        </div>

        <div class="mt-3">
            <input type="submit" class="btn btn-primary mb-3" value="Добавить комментрий">
        </div>
    </div>
</form>
{% else %}
<div class="alert alert-warning mt-2">
        Только зарегистрированные пользователи могут оставлять комментарии.
        <a href="{% url 'login' %}">Войдите</a> или <a href="{% url 'signup' %}">зарегистрируйтесь</a>.
    </div>
{% endif %}
